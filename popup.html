<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEEF+ Task Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <!-- タブナビゲーション -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="tasks">Tasks</button>
      <button class="tab-btn" data-tab="autologin">Credentials</button>
    </div>

    <!-- 課題一覧タブ -->
    <div id="tab-tasks" class="tab-content active">
      <div class="heading-row">
        <h2>Tasks</h2>
        <a class="beef-link-btn" href="https://beefplus.center.kobe-u.ac.jp/lms/task">Open BEEF+</a>
      </div>
      <p id="lastUpdated" class="updated-time">Last sync: no data</p>
      <section id="taskList" class="task-container">
        <p>No tasks yet.</p>
      </section>
    </div>

    <!-- 自動ログインタブ -->
    <div id="tab-autologin" class="tab-content">
      <h2>Credentials</h2>
      <form id="credentials-form">
        <label>
          Student ID
          <input id="username" name="username" type="text" autocomplete="off" placeholder="e.g. 1234567x" required>
        </label>
        <label>
          BEEF+ Password
          <input id="password" name="password" type="password" autocomplete="off" placeholder="Enter password" required>
        </label>
        <p class="note">機密情報はあなたのブラウザのローカルストレージの中にのみ保存され、いつでも削除可能です。<br>Credentials are stored only in your browser and can be removed anytime.</p>
        <div class="actions">
          <button type="submit" class="save" id="action-btn" disabled>Save</button>
          <button type="button" class="clear" id="clear-btn">Remove</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
