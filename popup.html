<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeefPlusEnhancer - 課題・自動ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <!-- タブナビゲーション -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="tasks">課題一覧</button>
      <button class="tab-btn" data-tab="autologin">自動ログイン</button>
    </div>

    <!-- 課題一覧タブ -->
    <div id="tab-tasks" class="tab-content active">
      <div class="heading-row">
        <h2>課題一覧</h2>
        <a class="beef-link-btn" href="https://beefplus.center.kobe-u.ac.jp/lms/task">Beef+へ</a>
      </div>
      <p id="lastUpdated" class="updated-time">最終更新：データ未取得</p>
      <section id="taskList" class="task-container">
        <p>課題は登録されていません。</p>
      </section>
    </div>

    <!-- 自動ログインタブ -->
    <div id="tab-autologin" class="tab-content">
      <h2>自動ログイン設定</h2>
      <form id="credentials-form">
        <label>
          学籍番号
          <input id="username" name="username" type="text" autocomplete="off" placeholder="例: 1234567x" required>
        </label>
        <label>
          パスワード
          <input id="password" name="password" type="password" autocomplete="off" placeholder="パスワードを入力" required>
        </label>
        <p class="note">入力した情報はブラウザのローカルストレージにのみ保存され、いつでも削除できます。</p>
        <div class="actions">
          <button type="submit" class="save" id="action-btn" disabled>保存</button>
          <button type="button" class="clear" id="clear-btn">削除</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
